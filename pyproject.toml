[project]
name = "obs4mips-cvs"
version = "0.1.0"
description = "Controlled vocabularies for obs4MIPs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3",
    "esgvoc>=5.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "jsonschema",
    "pyyaml",
]

[tool.poetry]
package-mode = false