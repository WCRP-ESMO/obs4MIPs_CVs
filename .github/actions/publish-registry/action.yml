name: Publish to esgvoc_registry
description: >
  Trigger the "Publish DB" workflow of WCRP-CMIP/esgvoc_registry for obs4mips.
  Without a token (no ESGVOC_REGISTRY_TOKEN secret), print the command to run by hand instead.

inputs:
  token:
    description: Token allowed to run workflows on WCRP-CMIP/esgvoc_registry (actions:write)
    required: false
    default: ""
  bump_type:
    description: patch, minor, major or dev-latest
    required: true
  version_override:
    description: Exact version to publish (blank = bump from the registry index)
    required: false
    default: ""
  universe_version:
    description: Universe version embedded in the DB (blank = latest stable universe)
    required: false
    default: ""
  project_ref:
    description: Branch / tag of this repo to build from
    required: false
    default: main
  universe_ref:
    description: Branch / tag of the universe repo
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Run the registry publish workflow
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BUMP_TYPE: ${{ inputs.bump_type }}
        VERSION_OVERRIDE: ${{ inputs.version_override }}
        UNIVERSE_VERSION: ${{ inputs.universe_version }}
        PROJECT_REF: ${{ inputs.project_ref }}
        UNIVERSE_REF: ${{ inputs.universe_ref }}
      run: |
        set -e
        ARGS=(
          -R WCRP-CMIP/esgvoc_registry
          -f project_id=obs4mips
          -f project_repo="${GITHUB_REPOSITORY}"
          -f bump_type="${BUMP_TYPE}"
          -f project_ref="${PROJECT_REF}"
          -f universe_ref="${UNIVERSE_REF}"
        )
        [ -n "${VERSION_OVERRIDE}" ] && ARGS+=(-f version_override="${VERSION_OVERRIDE}")
        [ -n "${UNIVERSE_VERSION}" ] && ARGS+=(-f universe_version="${UNIVERSE_VERSION}")

        if [ -z "${GH_TOKEN}" ]; then
          echo "::warning::No ESGVOC_REGISTRY_TOKEN secret: publish by hand with the command below"
          echo "gh workflow run publish.yml ${ARGS[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        gh workflow run publish.yml "${ARGS[@]}"
        echo "Triggered: https://github.com/WCRP-CMIP/esgvoc_registry/actions/workflows/publish.yml" | tee -a "$GITHUB_STEP_SUMMARY"
